version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: Build a budget tracker CLI in Python. Define monthly budgets per category,
  record expenses (amount, category, date, note) into a JSON file, reject unknown
  categories and invalid amounts, report spending per category against the budget,
  and alert when a category reaches 80% and 100% of its budget. Single file budget_tracker.py,
  stdlib only.
checks:
  must_include:
  - monthly budget per category
  - expense with amount, category, date and note saved to JSON
  - unknown category rejected
  - invalid amount rejected
  - spending per category against budget
  - alert at 80% and 100%
  - single file stdlib only
cases: []
