version: "0.1"
title: Secret Vault CLI
objective: Single-file Python CLI (vault.py) that stores secrets encrypted with Fernet under a password-derived key, with TTL, audit log, lockout and strict file permissions.
execution_mode: critical
context:
  system: Empty Python repository on macOS/Linux. Single file vault.py; the only third-party dependency is cryptography. State lives in ~/.vault/ (vault.enc, audit.log, .lockout).
  assumptions:
    - "Vault files live in ~/.vault/ resolved from the HOME directory: vault.enc, audit.log and .lockout."
    - "CLI shape: vault.py set KEY VALUE [--ttl DAYS], get KEY, list, delete KEY, rotate KEY VALUE [--ttl DAYS], audit."
    - "rotate replaces the value of an existing key and resets its expiry; it does not change the master password."
    - "Lockout counts consecutive wrong passwords in .lockout; while .lockout reaches 3 failures every command exits 2 without trying decryption; a correct password resets the counter."
    - "A missing VAULT_MASTER_KEY, bad key name, oversized value, missing key, or bad --ttl is a user error (exit 1)."
    - "The audit log records timestamp, command and key name only; get on a missing key exits 1."
    - "audit itself appends an audit line and then prints the last 20 lines; it needs a correct master password like every command."
    - "File header layout is the 16-byte salt followed by the Fernet token."
constraints:
  - Master password is read only from VAULT_MASTER_KEY, never from argv.
  - No dependency beyond the standard library and cryptography.
  - No secret value ever appears in the audit log, stderr or list output beyond the first 4 characters.
  - No network access, no remote sync, no multi-user support.
success_criteria:
  - All 14 requirements are demonstrated by passing unittest boundary tests run against vault.py as a subprocess with a temporary HOME.
hypotheses:
  - id: h1
    description: The vault is encrypted with a Fernet key derived by PBKDF2HMAC SHA-256 with 200000 iterations and a random 16-byte salt stored in the file header, and the password comes only from VAULT_MASTER_KEY.
    confidence: 0.85
  - id: h2
    description: Key names matching [a-zA-Z0-9_]{1,64} are accepted and stored lowercase, and values longer than 4096 UTF-8 bytes are rejected with exit 1.
    confidence: 0.9
  - id: h3
    description: set and rotate store an ISO-8601 expiry from --ttl DAYS (default 90), and get prints only the value, or exits 3 printing nothing when expired.
    confidence: 0.9
  - id: h4
    description: list shows value[:4] followed by *** and never the full value; delete removes a key; rotate exits 1 when the key does not exist.
    confidence: 0.9
  - id: h5
    description: audit appends to ~/.vault/audit.log and prints the last 20 lines, and the log and stderr hold key names and status messages.
    confidence: 0.85
  - id: h6
    description: Three wrong passwords create a .lockout file and exit 2, and exit codes are 0 ok, 1 user error, 2 auth/lockout, 3 expired.
    confidence: 0.85
  - id: h7
    description: vault.enc has mode 600 and ~/.vault/ has mode 700.
    confidence: 0.95
required_evidence:
  - "Output of python3 -m unittest discover -s tests showing all boundary tests passing."
  - "Gate report ending in RESULT: PASS."
actions:
  - id: a1
    description: Implement crypto, header salt and master-key handling in vault.py.
    type: implement
    requires_confirmation: false
    supports: [h1]
  - id: a2
    description: Implement key and value validation, TTL, and the set, get, list, delete, rotate commands.
    type: implement
    requires_confirmation: false
    supports: [h2, h3, h4]
  - id: a3
    description: Implement audit log, lockout, exit codes and file permissions.
    type: implement
    requires_confirmation: false
    supports: [h5, h6, h7]
  - id: a4
    description: Write subprocess-based unittest boundary tests in tests/test_vault.py with a temporary HOME.
    type: validate
    requires_confirmation: false
    supports: [h1, h2, h3, h4, h5, h6, h7]
  - id: a5
    description: Run the gate and review the report.
    type: validate
    requires_confirmation: false
    supports: [h1, h2, h3, h4, h5, h6, h7]
decision_rules:
  - If a requirement is ambiguous, stop and ask the user instead of guessing.
  - If a test needs a value in stderr or the audit log to pass, stop; that violates the spec.
metadata:
  source_prompt: "Build a Secret Vault CLI in Python (single file vault.py; the cryptography package is allowed) with the 14 requirements: master password from VAULT_MASTER_KEY; Fernet with PBKDF2HMAC SHA-256 200,000 iterations and random 16-byte salt in the header; keys [a-zA-Z0-9_]{1,64} stored lowercase; values at most 4096 bytes UTF-8; --ttl DAYS default 90 with ISO-8601 expiry; commands set, get, list, delete, rotate, audit; get prints only the value, exit 3 if expired; list shows value[:4]***; rotate exits 1 if key missing; audit appends to ~/.vault/audit.log and shows last 20 lines; 3 wrong passwords create .lockout, exit 2; never write values to audit log or stderr; vault.enc chmod 600 and ~/.vault/ chmod 700; exit codes 0/1/2/3."
  generator: claude-code-session
  scope_contract:
    must_include:
      - "VAULT_MASTER_KEY"
      - "PBKDF2HMAC SHA-256 200000 iterations"
      - "random 16-byte salt in header"
      - "keys stored lowercase"
      - "values at most 4096 bytes"
      - "--ttl default 90"
      - "expiry in ISO-8601"
      - "get prints only the value"
      - "exit 3 if expired"
      - "list shows value[:4]***"
      - "rotate exits 1 if key missing"
      - "audit shows last 20 lines"
      - "3 wrong passwords create .lockout"
      - "never write values to audit log or stderr"
      - "vault.enc chmod 600"
      - "~/.vault/ chmod 700"
formal:
  module: SecretVault
  obligations:
    - id: master_key_env_only
      kind: boundary
      statement: "The password is read from VAULT_MASTER_KEY; a missing variable exits 1 and no CLI argument supplies a password."
      hypotheses: [h1]
      must_include: ["VAULT_MASTER_KEY"]
      test: "test_vault.VaultTests.test_master_key_env_only"
    - id: kdf_and_salt
      kind: boundary
      statement: "vault.py uses PBKDF2HMAC SHA-256 with 200000 iterations, and vault.enc starts with a 16-byte random salt that differs between vaults."
      hypotheses: [h1]
      must_include: ["PBKDF2HMAC SHA-256 200000 iterations", "random 16-byte salt in header"]
      test: "test_vault.VaultTests.test_kdf_and_salt"
    - id: key_validation_lowercase
      kind: boundary
      statement: "Keys not matching [a-zA-Z0-9_]{1,64} exit 1; valid keys are stored lowercase so SET Foo is read by get foo."
      hypotheses: [h2]
      must_include: ["keys stored lowercase"]
      test: "test_vault.VaultTests.test_key_validation_lowercase"
    - id: value_size_limit
      kind: boundary
      statement: "A value of 4096 UTF-8 bytes is accepted and 4097 bytes (including multibyte) exits 1."
      hypotheses: [h2]
      must_include: ["values at most 4096 bytes"]
      test: "test_vault.VaultTests.test_value_size_limit"
    - id: ttl_default_and_iso
      kind: boundary
      statement: "Without --ttl the stored expiry is about 90 days ahead, --ttl DAYS overrides it, and the expiry is an ISO-8601 string."
      hypotheses: [h3]
      must_include: ["--ttl default 90", "expiry in ISO-8601"]
      test: "test_vault.VaultTests.test_ttl_default_and_iso"
    - id: get_value_only
      kind: boundary
      statement: "get on a valid key prints exactly the value (plus newline) on stdout and nothing on stderr."
      hypotheses: [h3]
      must_include: ["get prints only the value"]
      test: "test_vault.VaultTests.test_get_value_only"
    - id: expired_exit_3
      kind: boundary
      statement: "get on an expired key exits 3 and the value appears in neither stdout nor stderr."
      hypotheses: [h3, h6]
      must_include: ["exit 3 if expired"]
      test: "test_vault.VaultTests.test_expired_exit_3"
    - id: list_masks_value
      kind: boundary
      statement: "list prints each key with value[:4] followed by *** and never the full value."
      hypotheses: [h4]
      must_include: ["list shows value[:4]***"]
      test: "test_vault.VaultTests.test_list_masks_value"
    - id: delete_and_rotate
      kind: boundary
      statement: "delete removes a key; rotate replaces an existing value and exits 1 when the key does not exist."
      hypotheses: [h4]
      must_include: ["rotate exits 1 if key missing"]
      test: "test_vault.VaultTests.test_delete_and_rotate"
    - id: audit_last_20
      kind: boundary
      statement: "Every command appends a line to ~/.vault/audit.log and audit prints only the last 20 lines."
      hypotheses: [h5]
      must_include: ["audit shows last 20 lines"]
      test: "test_vault.VaultTests.test_audit_last_20"
    - id: no_value_leak
      kind: boundary
      statement: "After set, get, rotate and failing commands, neither audit.log nor stderr contains the secret value."
      hypotheses: [h5]
      must_include: ["never write values to audit log or stderr"]
      test: "test_vault.VaultTests.test_no_value_leak"
    - id: lockout_after_three
      kind: boundary
      statement: "Three wrong passwords create ~/.vault/.lockout and exit 2; further commands, even with the right password, exit 2."
      hypotheses: [h6]
      must_include: ["3 wrong passwords create .lockout"]
      test: "test_vault.VaultTests.test_lockout_after_three"
    - id: file_permissions
      kind: boundary
      statement: "vault.enc has mode 0600 and the ~/.vault/ directory has mode 0700 after writes."
      hypotheses: [h7]
      must_include: ["vault.enc chmod 600", "~/.vault/ chmod 700"]
      test: "test_vault.VaultTests.test_file_permissions"
scope:
  paths: ["vault.py", "tests/**"]
  tests: tests
  pythonpath: ["."]
