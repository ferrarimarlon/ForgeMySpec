version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: Build a Secret Vault CLI in Python (single file vault.py; the cryptography
  package is allowed) with VAULT_MASTER_KEY, Fernet+PBKDF2 200k, key/value limits,
  TTL, set/get/list/delete/rotate/audit, lockout, audit log, permissions and exit
  codes 0/1/2/3.
checks:
  must_include:
  - master password from VAULT_MASTER_KEY
  - PBKDF2HMAC SHA-256 200000 iterations
  - random 16-byte salt in file header
  - keys stored lowercase
  - values at most 4096 bytes
  - --ttl DAYS default 90
  - expiry stored as ISO-8601
  - get exits 3 if expired
  - list shows value[:4]***
  - rotate exits 1 if key missing
  - audit shows last 20 lines
  - 3 wrong passwords create .lockout
  - never write values to audit log or stderr
  - vault.enc chmod 600 and .vault chmod 700
  - exit codes 0 1 2 3
cases: []
