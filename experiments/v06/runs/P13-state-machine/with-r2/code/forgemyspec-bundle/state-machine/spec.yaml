version: "0.1"
title: State machine CLI
objective: Single-file stdlib Python CLI (state_machine.py) that loads a JSON state machine, validates it, runs an event sequence with guards over a context, and prints the transition history.
execution_mode: critical
context:
  system: Empty Python repository; Python 3 stdlib only; unittest for tests. Deliverable is state_machine.py at the repository root plus tests in tests/.
  assumptions:
    - "JSON shape: {states: [str], initial: str, final: [str], transitions: [{from, event, to, guard?}]}."
    - "A guard is an object {key, op, value} with op in ==, !=, <, <=, >, >=, in; it is evaluated against a context dict given by --context JSON."
    - "Transitions with the same from-state and event are tried in file order; the first whose guard passes (or has no guard) fires."
    - "An event with no firing transition is rejected: the run stops, the history so far is printed, exit code 1."
    - "Exit codes: 0 success, 1 rejected event, 2 invalid definition or bad input."
    - "Final states may still be left by transitions only if declared; running continues until events end or one is rejected."
constraints:
  - Single file state_machine.py, standard library only; no third-party packages.
  - No expression evaluator (no eval/exec); guards are structured data only.
  - No persistence, no network, no GUI, no hierarchical or parallel states.
success_criteria:
  - A valid definition runs an event sequence and prints the history with exit 0.
  - An invalid definition reports every validation error and exits 2.
hypotheses:
  - id: h1
    description: Loading a JSON definition with states, initial, final and transitions yields a machine; malformed JSON or missing fields exit 2 with a message.
    confidence: 0.9
  - id: h2
    description: Validation reports unknown states, unreachable states and a missing initial state.
    confidence: 0.9
  - id: h3
    description: Running events fires the first transition whose guard passes against the context, and stops the run, exit 1, on an event that matches only failing guards or unknown events.
    confidence: 0.85
  - id: h4
    description: The machine appends each fired transition to its history, and the CLI prints that history in firing order.
    confidence: 0.9
actions:
  - id: a1
    description: Implement definition loading and validation in state_machine.py.
    type: implement
    requires_confirmation: false
    supports: [h1, h2]
  - id: a2
    description: Implement guard evaluation, event running and history printing plus the CLI.
    type: implement
    requires_confirmation: false
    supports: [h3, h4]
  - id: a3
    description: Write unittest tests for every obligation and run them.
    type: test
    requires_confirmation: false
    supports: [h1, h2, h3, h4]
required_evidence:
  - "Output of python3 -m unittest discover -s tests showing all tests pass."
  - "CLI output of validate on an invalid definition listing the errors, with exit code 2."
  - "CLI output of run on a valid definition printing the transition history."
decision_rules:
  - If a requirement is ambiguous, stop and ask the user.
  - Anything not covered by an obligation is a spec amendment.
metadata:
  source_prompt: "Build a state machine CLI in Python. Load a machine definition from JSON (states, initial state, final states, transitions with events and optional guard conditions on a context), validate it (unknown states, unreachable states, missing initial state), run a sequence of events against it, and keep a history of transitions that can be printed. Single file state_machine.py, stdlib only."
  generator: claude-code-session
  scope_contract:
    must_include:
      - "load machine from JSON"
      - "unknown states rejected"
      - "unreachable states rejected"
      - "missing initial state rejected"
      - "guard conditions on context"
      - "run sequence of events"
      - "printable transition history"
      - "single file stdlib only"
formal:
  module: StateMachineCore
  obligations:
    - id: load_json
      kind: boundary
      statement: "Loading valid JSON yields a machine; malformed JSON or missing required fields exits 2 with a message."
      hypotheses: [h1]
      must_include: ["load machine from JSON"]
      test: "test_state_machine.LoadTests.test_load_json"
    - id: unknown_states
      kind: boundary
      statement: "Validation reports any state referenced by initial, final or a transition that is not in states."
      hypotheses: [h2]
      must_include: ["unknown states rejected"]
      test: "test_state_machine.ValidateTests.test_unknown_states"
    - id: unreachable_states
      kind: boundary
      statement: "Validation reports states not reachable from the initial state."
      hypotheses: [h2]
      must_include: ["unreachable states rejected"]
      test: "test_state_machine.ValidateTests.test_unreachable_states"
    - id: missing_initial
      kind: boundary
      statement: "Validation reports an absent or empty initial state."
      hypotheses: [h2]
      must_include: ["missing initial state rejected"]
      test: "test_state_machine.ValidateTests.test_missing_initial"
    - id: guards
      kind: boundary
      statement: "A transition fires only if its guard holds on the context; the first passing transition for the event wins; unguarded transitions always pass."
      hypotheses: [h3]
      must_include: ["guard conditions on context"]
      test: "test_state_machine.GuardTests.test_guards"
    - id: run_events
      kind: boundary
      statement: "Running a sequence moves the machine through events in order; an event with no applicable transition stops the run with exit 1."
      hypotheses: [h3]
      must_include: ["run sequence of events"]
      test: "test_state_machine.RunTests.test_run_events"
    - id: history
      kind: boundary
      statement: "Each fired transition is recorded (step, from, event, to) and printed in order by the CLI."
      hypotheses: [h4]
      must_include: ["printable transition history"]
      test: "test_state_machine.HistoryTests.test_history_printed"
    - id: single_file
      kind: boundary
      statement: "state_machine.py imports only standard library modules and is the single source file."
      hypotheses: [h1]
      must_include: ["single file stdlib only"]
      test: "test_state_machine.StructureTests.test_stdlib_only"
scope:
  paths: ["state_machine.py", "tests/**"]
  tests: tests
  pythonpath: ["."]
