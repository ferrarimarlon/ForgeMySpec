version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: Build a grade calculator CLI in Python. Read a CSV of students and
  assessment scores plus a weights definition, normalize weights that do not sum to
  100%, compute each student's weighted final grade, letter grade and GPA points,
  and print class statistics (mean, median, standard deviation, highest, lowest).
  Single file grade_calc.py, stdlib only.
checks:
  must_include:
  - weights normalized to 100%
  - weighted final grade
  - letter grade and GPA points
  - class mean, median, standard deviation, highest, lowest
  - invalid input exits 2
  - single file grade_calc.py, stdlib only
cases: []
