[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemyspec"
version = "0.1.0"
description = "Deterministic harness for Claude Code: lints specs, checks obligation coverage, and gates Dafny contracts (verify, test, audit, mutation, lock) before translating to Python."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
forgemyspec = "forgemyspec.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
