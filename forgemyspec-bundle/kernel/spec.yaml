version: "0.1"
title: "ForgeMySpec trust kernel"
objective: >-
  Prove in Dafny the four decisions that trust in ForgeMySpec depends on: each obligation's color, each
  requirement's status, the guards' decision about an edit, and the coverage of hypotheses and phrases. The Python of
  the guards, the gate and the risk box uses only the translation of this kernel for these decisions.
execution_mode: critical

context:
  system: >-
    Formal bundle inside the ForgeMySpec repository. contract.dfy defines the abstract module TrustKernel, impl.dfy
    refines it as KernelImpl, and the Python translation goes to src/forgemyspec/_kernel/, loaded by
    src/forgemyspec/kernel.py. Classifying paths into categories, reading files and assembling text stay in the Python
    glue, covered by the boundary tests of the forgemyspec-bundle/enforcement bundle.
  assumptions:
    - "The input types (status, phase, gate state, path category) are produced by the Python glue, which is tested but not proven."
    - "Failure and surviving-mutant counts arrive as natural numbers already summed by the gate."
    - "Dafny strings (seq<char>) translated to Python need conversion in the glue; the conversion is covered by the boundary tests."

constraints:
  - "The kernel is pure: no I/O, no state, no {:extern}."
  - "Each decision has an exact output for every input case, so that mutants and planted errors are caught."
  - "None of these four decisions is reimplemented in Python."

success_criteria:
  - "`forgemyspec gate forgemyspec-bundle/kernel` passes every stage, with 100% of valid mutants killed and every planted error rejected."
  - "Each obligation has a Dafny test with concrete values, including each rule's edge cases."

hypotheses:
  - id: h1
    description: "ClassifyObligation yields Proven exactly when the obligation is Dafny, has zero failures, zero surviving mutants, passing tests and zero blocks."
    confidence: 0.9
  - id: h2
    description: "RequirementStatus only treats a requirement as met with an approved bundle and a current gate, and the status is that of the worst obligation covering it, with its index."
    confidence: 0.85
  - id: h3
    description: "DecideEdit follows the guards' decision table for every combination of category, bundle kind and phase."
    confidence: 0.85
  - id: h4
    description: "Coverage returns exactly the hypotheses and phrases absent from every obligation's references."
    confidence: 0.85

required_evidence:
  - "Full gate report for the kernel, with mutation and planted errors."
  - "Output of the kernel's Dafny tests."

actions:
  - id: a1
    type: design
    description: "Write contract.dfy, tests.dfy and planted/ and show them to the user, who approves by running `lock` in their own terminal."
    requires_confirmation: true
    supports: [h1, h2, h3, h4]
  - id: a2
    type: implement
    description: "Write impl.dfy refining the contract until verification, tests, audit, mutation and planted errors pass."
    requires_confirmation: false
    supports: [h1, h2, h3, h4]
  - id: a3
    type: validate
    description: "Run the kernel's gate and record the report."
    requires_confirmation: false
    supports: [h1, h2, h3, h4]

decision_rules:
  - "If a property cannot be proven as written, stop and amend the contract with the user; never weaken the clause to make the proof pass."
  - "If a planted error survives, strengthen the contract or the tests with new approval; never delete the error."

formal:
  module: TrustKernel
  obligations:
    - id: failure_means_leaking
      kind: dafny
      statement: "Any failure attributed to an obligation makes it Leaking."
      hypotheses: [h1]
      must_include: ["failure means leaking"]
    - id: boundary_is_at_most_fragile
      kind: dafny
      statement: "A boundary obligation is at most Fragile, and Leaking when its tests fail."
      hypotheses: [h1]
      must_include: ["boundary obligation is at most fragile"]
    - id: surviving_mutant_weakens
      kind: dafny
      statement: "A surviving mutant makes a Dafny obligation Fragile."
      hypotheses: [h1]
      must_include: ["surviving mutant weakens"]
    - id: proven_requires_full_evidence
      kind: dafny
      statement: "Proven holds if and only if the obligation is Dafny, with zero failures, zero surviving mutants, passing tests and no block."
      hypotheses: [h1]
      must_include: ["proven requires full evidence"]
    - id: met_requires_approval_and_current_gate
      kind: dafny
      statement: "A met requirement requires an approved bundle, a current gate and at least one obligation."
      hypotheses: [h2]
      must_include: ["met requires approval and a current gate"]
    - id: requirement_takes_worst_obligation
      kind: dafny
      statement: "A requirement's status is that of the worst obligation covering it, and the reason points to its index."
      hypotheses: [h2]
      must_include: ["requirement takes the worst obligation"]
    - id: protected_always_denied
      kind: dafny
      statement: "An edit to a protected path is always denied; outside the project, allowed paths and bundle docs are allowed."
      hypotheses: [h3]
      must_include: ["protected path always denied"]
    - id: outside_spec_denied
      kind: dafny
      statement: "Code outside any spec is denied; code covered by scope.paths is only allowed with an approved bundle."
      hypotheses: [h3]
      must_include: ["code outside the spec denied"]
    - id: locked_spec_protected
      kind: dafny
      statement: "After approval, a spec-only bundle's spec is locked and a formal bundle's spec only accepts changes outside the formal section and the version."
      hypotheses: [h3]
      must_include: ["locked spec protected"]
    - id: locked_contract_protected
      kind: dafny
      statement: "Contract, Dafny tests and planted errors are only editable in draft."
      hypotheses: [h3]
      must_include: ["locked contract protected"]
    - id: impl_requires_lock
      kind: dafny
      statement: "Implementation is only allowed with the bundle locked and the lock matching."
      hypotheses: [h3]
      must_include: ["implementation requires a lock"]
    - id: exact_coverage
      kind: dafny
      statement: "A hypothesis or phrase is missing if and only if no obligation references it."
      hypotheses: [h4]
      must_include: ["exact coverage"]

metadata:
  source_prompt: >-
    Make sure ForgeMySpec, built with an LLM's help, builds quality specs with harness and auditability: the decisions
    behind trust must be proven, not only tested.
  generator: claude-code-session
  scope_contract:
    must_include:
      - "failure means leaking"
      - "boundary obligation is at most fragile"
      - "surviving mutant weakens"
      - "proven requires full evidence"
      - "met requires approval and a current gate"
      - "requirement takes the worst obligation"
      - "protected path always denied"
      - "code outside the spec denied"
      - "locked spec protected"
      - "locked contract protected"
      - "implementation requires a lock"
      - "exact coverage"
