version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: 'How to make the flow part of everything the user does: a strict hook
  mode, distributed by a `forgemyspec init` command instead of a plugin. Full auditability
  inside the chat, per prompt, with a box that reflects the risk the user is taking:
  what is met, what is leaking and how much room the LLM has to hallucinate, with
  line breaks so it does not get truncated. ForgeMySpec was built with an LLM''s help,
  so the decisions behind trust must be proven, not only tested. Everything in English:
  code, documentation and screens.'
checks:
  must_include:
  - forgemyspec init
  - strict PreToolUse file guard
  - Bash guard
  - human-only approval
  - Stop hook gate check
  - per-prompt risk box
  - room to hallucinate
  - per-obligation evidence
  - state injection
  - git pre-commit gate
  - spec-only bundles with scope.paths
  - English-only output
  - English documentation
  - trust kernel proven in Dafny
  - planted errors
cases: []
