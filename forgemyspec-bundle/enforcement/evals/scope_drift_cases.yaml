version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: "Como garantir que o fluxo fique embutido em tudo que o usu\xE1rio\
  \ fizer: padr\xE3o de hooks estrito, distribu\xEDdo por um comando `forgemyspec\
  \ init` em vez de plugin. Auditabilidade total dentro do chat, a n\xEDvel de prompt,\
  \ com uma caixa que seja reflexo do risco que o usu\xE1rio est\xE1 correndo: o que\
  \ est\xE1 atendido, o que est\xE1 furando e quanto espa\xE7o o LLM tem para alucinar,\
  \ com quebras de linha para n\xE3o truncar. Tudo em portugu\xEAs, incluindo README\
  \ e skills."
checks:
  must_include:
  - forgemyspec init
  - trava estrita de arquivos no PreToolUse
  - trava de Bash
  - "aprova\xE7\xE3o s\xF3 humana"
  - checagem do gate no Stop
  - caixa de risco por prompt
  - "espa\xE7o para alucinar"
  - "evid\xEAncia por obriga\xE7\xE3o"
  - "inje\xE7\xE3o de estado"
  - gate no pre-commit do git
  - "bundles s\xF3 de spec com scope.paths"
  - "sa\xEDda em portugu\xEAs"
  - "README e skills em portugu\xEAs"
cases: []
