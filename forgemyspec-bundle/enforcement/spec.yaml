    requires_confirmation: false
    supports: [h4, h6]
  - id: a6
    type: implement
    description: "Implement the Stop hook: gate-cache check with block or release, and the risk box from per-obligation evidence, the project's line classification, the previous turn's snapshot, each contract's strength and the transcript's token usage, with colors and statuses coming from the translated kernel."
    requires_confirmation: false
    supports: [h5, h7]
  - id: a6b
    type: implement
