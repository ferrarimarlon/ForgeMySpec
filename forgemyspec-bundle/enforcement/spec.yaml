decision_rules:
  - "Se uma trava não consegue decidir (entrada ilegível, ferramenta desconhecida), negar em modo estrito e dizer a causa; nunca liberar por padrão."
  - "Se o uso de tokens da transcrição não puder ser lido, mostrar 'tokens indisponíveis' na caixa; nunca estimar tokens."
  - "Se o limite de repetições do Stop for atingido com o gate falhando, liberar o turno com um systemMessage dizendo que o trabalho não está verificado; nunca apresentá-lo como pronto."
  - "Se uma trava bloquear trabalho legítimo, ampliar a regra pelo config.yaml ou pelo scope.paths de um bundle com aprovação do usuário; nunca criar uma flag de desvio que o Claude possa ligar."
  - "Se um hook passar do tempo limite, guardar a parte cara (descoberta de bundles, hashes) em cache em .forgemyspec/state em vez de remover a checagem."
  - "Se um texto de mensagem não tiver tradução no módulo de mensagens, o teste falha; nunca deixar texto em inglês escapar para o usuário."
  - "Se uma propriedade do núcleo não puder ser provada como está escrita, parar e emendar com o usuário; nunca devolver a decisão para Python não provado."
  - "Se um erro plantado sobreviver, fortalecer o contrato ou os testes com nova aprovação do usuário; nunca apagar o erro plantado para o gate passar."

formal:
  module: EnforcementPolicy
  obligations:
    - id: guard_decision
      kind: boundary
      statement: "A trava de arquivos retorna allow só para caminhos cobertos por um bundle aprovado na fase certa ou pela lista de permitidos, e deny com motivo nos demais casos."
      hypotheses: [h2, h6]
      must_include: ["trava estrita de arquivos no PreToolUse", "bundles só de spec com scope.paths"]
      test: "test_hooks.FileGuardTests.test_decision_table"
    - id: bash_guard
      kind: boundary
      statement: "A trava de Bash nega comandos de aprovação, --no-verify e escritas de shell em caminhos protegidos."
      hypotheses: [h3, h4]
      must_include: ["trava de Bash", "aprovação só humana"]
      test: "test_hooks.BashGuardTests.test_decision_table"
    - id: stop_gate
      kind: boundary
      statement: "O hook de Stop bloqueia quando um bundle travado não tem gate PASS para o conteúdo atual e libera de forma honesta no limite de repetições."
      hypotheses: [h5]
      must_include: ["checagem do gate no Stop"]
      test: "test_hooks.StopHookTests.test_gate_states"
    - id: risk_box
      kind: boundary
      statement: "O hook de Stop mostra a caixa de risco: status de cada requisito com motivo, espaço para alucinar, furos, itens que só o usuário garante e a nota de tokens."
      hypotheses: [h7]
      must_include: ["caixa de risco por prompt", "espaço para alucinar"]
      test: "test_hooks.RiskBoxTests.test_box_states"
    - id: obligation_evidence
      kind: boundary
      statement: "O gate atribui erros de verificação, resultados de testes e mutantes sobreviventes aos ids das obrigações."
      hypotheses: [h7]
      must_include: ["evidência por obrigação"]
      test: "test_gate.EvidenceTests.test_attribution"
    - id: init_install
      kind: boundary
      statement: "O init instala todos os componentes de forma idempotente, mesclando e fazendo backup dos arquivos existentes, e o --check detecta divergências."
      hypotheses: [h1]
      must_include: ["forgemyspec init", "gate no pre-commit do git"]
      test: "test_init.InitTests.test_install_merge_idempotent_check"
    - id: state_injection
      kind: boundary
      statement: "SessionStart e UserPromptSubmit injetam a fase e o próximo passo de cada bundle."
      hypotheses: [h8]
      must_include: ["injeção de estado"]
      test: "test_hooks.StateTests.test_summary"
    - id: kernel_used
      kind: boundary
      statement: "As travas, o gate e a caixa obtêm cor, status, decisão de edição e cobertura do núcleo traduzido em src/forgemyspec/_nucleo, que bate com uma tradução nova."
      hypotheses: [h10]
      must_include: ["núcleo de confiança provado em Dafny"]
      test: "test_nucleo.NucleoTests.test_decisions_come_from_translated_kernel"
    - id: planted_errors
      kind: boundary
      statement: "O gate exige pelo menos 3 erros plantados por bundle formal, todos rejeitados, cobertos pelo lock, e mostra a força do contrato na caixa."
      hypotheses: [h11]
      must_include: ["erros plantados"]
      test: "test_gate.PlantedErrorsTests.test_stage"
    - id: portuguese_output
      kind: boundary
      statement: "Toda mensagem do harness sai do módulo de mensagens em português, e o lint acusa negação em hipóteses em português."
      hypotheses: [h9]
      must_include: ["saída em português", "README e skills em português"]
      test: "test_messages.MessagesTests.test_all_output_in_portuguese"

metadata:
  source_prompt: >-
    Como garantir que o fluxo fique embutido em tudo que o usuário fizer: padrão de hooks estrito, distribuído por
    um comando `forgemyspec init` em vez de plugin. Auditabilidade total dentro do chat, a nível de prompt, com
    uma caixa que seja reflexo do risco que o usuário está correndo: o que está atendido, o que está furando e
    quanto espaço o LLM tem para alucinar, com quebras de linha para não truncar. Tudo em português, incluindo
    README e skills.
  generator: claude-code-session
  scope_contract:
    must_include:
      - "forgemyspec init"
      - "trava estrita de arquivos no PreToolUse"
      - "trava de Bash"
      - "aprovação só humana"
      - "checagem do gate no Stop"
      - "caixa de risco por prompt"
      - "espaço para alucinar"
      - "evidência por obrigação"
      - "injeção de estado"
      - "gate no pre-commit do git"
      - "bundles só de spec com scope.paths"
      - "saída em português"
      - "README e skills em português"
      - "núcleo de confiança provado em Dafny"
      - "erros plantados"
