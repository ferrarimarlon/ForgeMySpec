  - id: a2
    type: implement
    description: "Implement `forgemyspec init [--check]`: copy the harness, the skills and the agent, merge settings.json (agent key and command hooks with onFailure block), the marked block in CLAUDE.md, .gitignore, .githooks/pre-commit with core.hooksPath and the CI workflow, with backups and idempotency."
    requires_confirmation: false
    supports: [h1]
  - id: a3
    type: implement
    description: "Implement the PreToolUse file guard: resolve the target path, find the bundle that covers it and its phase, simulate the result of Edit/MultiEdit to detect changes to a locked formal section, and return deny with the next step or no objection."
    requires_confirmation: false
    supports: [h2]
  - id: a4
    type: implement
    description: "Implement the Bash guard for approval commands, --no-verify and shell writes to denied paths."
    requires_confirmation: false
