    type: design
    description: "Formalize the trust kernel in forgemyspec-bundle/kernel: spec with dafny obligations, contract.dfy, tests.dfy and planted/; show it to the user, who approves by running `lock` in their own terminal."
    requires_confirmation: true
    supports: [h10]
  - id: a0b
    type: implement
    description: "Implement the kernel's impl.dfy until the gate passes, translate it into src/forgemyspec/_kernel/ with a Python loader, and add the drift check to CI."
    requires_confirmation: false
    supports: [h10]
  - id: a0c
    type: implement
    description: "Add the planted-errors stage to the gate, move the lock to version 2 covering planted/, update /forgemyspec-formalize to write the planted errors and create at least 3 planted errors in examples/budget-core, which the user locks again."
    requires_confirmation: true
    supports: [h11]
  - id: a1
    type: design
    description: "Define .forgemyspec/config.yaml (strict enforcement, allowed paths, bundle roots), scope.paths, scope.tests, verify_command and the spec lock via approve for spec-only bundles, the ledger record format, and the gate cache keyed by a hash of the bundle's inputs."
    requires_confirmation: false
