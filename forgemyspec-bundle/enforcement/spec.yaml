    requires_confirmation: false
    supports: [h1, h2, h3, h4, h5, h6, h7, h8, h9, h10, h11, h12]

decision_rules:
  - "If a guard cannot decide (unreadable input, unknown tool), deny in strict mode and state the cause; never allow by default."
  - "If the transcript's token usage cannot be read, show 'tokens unavailable' in the box; never estimate tokens."
  - "If the Stop repeat limit is reached with the gate failing, release the turn with a systemMessage saying the work is not verified; never present it as done."
  - "If a guard blocks legitimate work, widen the rule through config.yaml or a bundle's scope.paths with the user's approval; never add a bypass flag Claude can turn on."
  - "If a hook would exceed its time budget, cache the expensive part (bundle discovery, hashes) in .forgemyspec/state instead of dropping the check."
  - "If a message text is not in the messages module, the test fails; never let text outside the catalog reach the user."
  - "If a kernel property cannot be proven as written, stop and amend with the user; never move the decision back into unproven Python."
  - "If a planted error survives, strengthen the contract or the tests with the user's new approval; never delete the planted error."

scope:
  paths: ["src/**", "tests/**", "plugins/**"]
  tests: tests
  pythonpath: [src]

formal:
  module: EnforcementPolicy
  obligations:
    - id: guard_decision
      kind: boundary
      statement: "The file guard objects to nothing only for paths covered by an approved bundle in the right phase or by the allow list, and denies with a reason otherwise."
      hypotheses: [h2, h6]
      must_include: ["strict PreToolUse file guard", "spec-only bundles with scope.paths"]
      test: "test_hooks.FileGuardTests.test_decision_table"
    - id: bash_guard
      kind: boundary
      statement: "The Bash guard denies approval commands, --no-verify and shell writes to denied paths."
      hypotheses: [h3, h4]
      must_include: ["Bash guard", "human-only approval"]
      test: "test_hooks.BashGuardTests.test_decision_table"
    - id: stop_gate
      kind: boundary
      statement: "The Stop hook blocks when a locked bundle has no PASS gate for its current content and releases honestly at the repeat limit."
      hypotheses: [h5]
      must_include: ["Stop hook gate check"]
      test: "test_hooks.StopHookTests.test_gate_states"
    - id: risk_box
      kind: boundary
      statement: "The Stop hook shows the risk box: each requirement's status with its reason, room to hallucinate, leaks, the items only the user guarantees and the token note."
      hypotheses: [h7]
      must_include: ["per-prompt risk box", "room to hallucinate"]
      test: "test_hooks.RiskBoxTests.test_box_states"
    - id: obligation_evidence
      kind: boundary
      statement: "The gate attributes verification errors, test results and surviving mutants to obligation ids."
      hypotheses: [h7]
      must_include: ["per-obligation evidence"]
      test: "test_gate.EvidenceTests.test_attribution"
    - id: init_install
      kind: boundary
      statement: "init installs every component idempotently, merging and backing up existing files, and --check detects drift."
      hypotheses: [h1]
      must_include: ["forgemyspec init", "git pre-commit gate"]
      test: "test_init.InitTests.test_install_merge_idempotent_check"
    - id: state_injection
      kind: boundary
      statement: "SessionStart and UserPromptSubmit inject each bundle's phase and next step."
      hypotheses: [h8]
      must_include: ["state injection"]
      test: "test_hooks.StateTests.test_summary"
    - id: chat_approval
      kind: boundary
      statement: "An approval typed in the chat is accepted only as a code from a human-origin message after the request, for unchanged content, once."
      hypotheses: [h4, h12]
      must_include: ["approval in the chat bound to the content"]
      test: "test_approvals.ApprovalTests.test_chat_approval_flow"
    - id: english_output
      kind: boundary
      statement: "Every harness message comes from the English messages module, and the lint flags negation in hypotheses per language."
      hypotheses: [h9]
      must_include: ["English-only output", "English documentation"]
      test: "test_messages.MessagesTests.test_all_output_in_english"
    - id: kernel_used
      kind: boundary
      statement: "The guards, the gate and the box get colors, statuses, edit decisions and coverage from the translated kernel in src/forgemyspec/_kernel, which matches a fresh translation."
      hypotheses: [h10]
      must_include: ["trust kernel proven in Dafny"]
      test: "test_kernel.KernelTests.test_decisions_come_from_translated_kernel"
    - id: planted_errors
      kind: boundary
      statement: "The gate requires at least 3 planted errors per formal bundle, all rejected, covered by the lock, and shows the contract's strength in the box."
      hypotheses: [h11]
      must_include: ["planted errors"]
      test: "test_gate.PlantedErrorsTests.test_stage"

metadata:
  source_prompt: >-
    How to make the flow part of everything the user does: a strict hook mode, distributed by a `forgemyspec init`
    command instead of a plugin. Full auditability inside the chat, per prompt, with a box that reflects the risk the
    user is taking: what is met, what is leaking and how much room the LLM has to hallucinate, with line breaks so it
    does not get truncated. ForgeMySpec was built with an LLM's help, so the decisions behind trust must be proven,
    not only tested. Everything in English: code, documentation and screens.
  generator: claude-code-session
  scope_contract:
    must_include:
      - "forgemyspec init"
      - "strict PreToolUse file guard"
      - "Bash guard"
      - "human-only approval"
      - "Stop hook gate check"
      - "per-prompt risk box"
      - "room to hallucinate"
      - "per-obligation evidence"
      - "state injection"
      - "git pre-commit gate"
      - "spec-only bundles with scope.paths"
      - "English-only output"
      - "English documentation"
      - "trust kernel proven in Dafny"
      - "planted errors"
      - "approval in the chat bound to the content"
