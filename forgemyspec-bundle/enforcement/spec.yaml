    requires_confirmation: false
    supports: [h7]
  - id: a7
    type: implement
    description: "Implement the SessionStart and UserPromptSubmit hooks: turn marker in the ledger and the state summary as additionalContext."
    requires_confirmation: false
    supports: [h7, h8]
  - id: a7b
