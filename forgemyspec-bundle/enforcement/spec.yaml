  - id: a8
    type: implement
    description: "Fix this repository's .claude/settings.json to the `agent` key, give this bundle a scope with paths src/**, tests/** and plugins/**, tests: tests and pythonpath: [src], ask the user to run init, approve this bundle and lock the kernel, and confirm that ForgeMySpec's own box reflects the coverage."
    requires_confirmation: true
    supports: [h1, h6]
