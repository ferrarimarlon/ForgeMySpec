version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: "Esse projeto tem o objetivo de criar especifica\xE7\xF5es s\xF3lidas\
  \ e j\xE1 testadas antes de uma IA tocar, para ter harness m\xE1ximo e alucina\xE7\
  \xE3o m\xEDnima. Queremos introduzir a linguagem Dafny: transformar a especifica\xE7\
  \xE3o em Dafny, j\xE1 com os testes, para ter mais certeza no n\xEDvel de harness,\
  \ diminuindo o risco de fazer tudo por LLM. Seguir com a op\xE7\xE3o A (implementa\xE7\
  \xE3o em Dafny, verificada, traduzida para Python), sanitizando o reposit\xF3rio:\
  \ em vez de um c\xF3digo separado, gerar tudo dentro do Claude Code, como uma skill\
  \ com harness, num projeto clon\xE1vel usado pelo Claude Code. Corrigir tamb\xE9\
  m os problemas da revis\xE3o (specs YAML inv\xE1lidas, docs com caminhos inexistentes,\
  \ artefatos de build commitados, checagem de escopo tautol\xF3gica no CI)."
checks:
  must_include:
  - no external LLM API calls
  - dafny verify
  - dafny test
  - dafny audit
  - dafny translate py
  - contract lint
  - mutation check
  - contract lock
  - obligation coverage
  - Dafny 4.x external toolchain
  - PyYAML only runtime dependency
cases: []
