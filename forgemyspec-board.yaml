- id: R1
  status: done
  title: Revamp on the pre-Dafny version, with the conversation board
  quote: a gente vai pegar esse modelo e encaixar num commit da versão antes da gente fazer essa grande reestruturação… manter o que esse projeto trouxe de bom, que são as clarezas dos requerimentos e a quantidade de harness e model usadas. E o modelo do anterior que já estava funcionando.
  steps:
  - do: main holds the f95101a version (last commit before the Dafny restructure); v0.6 stays in history (323bd0d)
    check: 'cmd: git merge-base --is-ancestor 323bd0d HEAD && git diff --quiet f95101a HEAD -- src/forgemyspec/linting.py src/forgemyspec/generator.py'
  - do: experiments kept, including the v0.6 report
    check: 'cmd: test -f experiments/v06/REPORT.md && test -f experiments/COMPARATIVE_REPORT.md'
  - do: board ported as a standalone module (requirements, verified vs claimed, harness vs model, tokens)
    check: 'test: test_board'
  - do: Stop hook, board skill, agent preload and CLAUDE.md rule
    check: 'cmd: grep -q hook-stop .claude/settings.json && test -f .claude/skills/forgemyspec-board/SKILL.md && grep -q forgemyspec-board plugins/forgemyspec/agents/forgemyspec-default.md && grep -q "Conversation Board" CLAUDE.md'
  - do: old version's tests still pass
    check: 'cmd: PYTHONPATH=src python3 -m unittest discover -s tests'
- id: R2
  status: done
  title: The revamp is main, with no separate folder
  quote: Então eu quero o revamp na main… sem criar uma pasta chamada revamping
  steps:
  - do: main's files are the revamp (board module present, Dafny kernel gone)
    check: 'cmd: test -f src/forgemyspec/board.py && test ! -e src/forgemyspec/_kernel && test -f forgemyspec-board.yaml'
  - do: no extra worktree or branch
    check: 'cmd: test $(git worktree list | wc -l) -eq 1 && test "$(git branch | wc -l)" -eq 1 && git branch | grep -q "^\* main$"'
- id: R3
  status: done
  title: Push the revamp to GitHub
  quote: Faz o push.
  steps:
  - do: HEAD 98287c0 is on origin/main
    check: 'cmd: git fetch -q origin && git merge-base --is-ancestor 98287c0 origin/main'
- id: R4
  status: done
  title: Could Dafny strengthen the board's harness? (answer)
  quote: Esse harness poderia ser melhor absorvido usando o Daphne?
  steps:
  - do: answer grounded in the v0.6 report (Dafny never chosen, 5x cost, only pure logic)
    check: 'cmd: grep -q "54 of 54 with-arm builds were spec-only" experiments/v06/REPORT.md'
- id: R5
  status: done
  title: Push the board updates
  quote: faz o push.
  steps:
  - do: local main has no commits missing from origin/main
    check: 'cmd: git fetch -q origin && test -z "$(git log origin/main..HEAD --oneline)"'
- id: R6
  status: open
  title: Board must reflect independent verification, not the model testing itself
  quote: O que você está chamando de harness é você escrevendo e testando. Mas isso você já faria sem precisar disso, certo?
  steps:
  - do: label what is measured honestly (checks written and run by the model)
  - do: checks owned by the user and locked before the code, which the model cannot edit
  - do: checks run by a hook (Stop, pre-commit), not when the model chooses
  - do: check strength measured (mutation), so a trivial check does not earn a tick
  - do: independent blind verifier for done requirements
  next: user picks which of these to build
- id: R7
  status: doing
  title: CI failing after push (Python 3.9 missing on ubuntu-latest)
  quote: Verifica por que está dando erro no push.
  steps:
  - do: cause found — ubuntu-latest is 26.04, setup-python has no 3.9 there; push itself succeeded
    ok: true
  - do: workflows pinned to ubuntu-24.04
    check: 'cmd: grep -q "runs-on: ubuntu-24.04" .github/workflows/tests.yml && grep -q "runs-on: ubuntu-24.04" .github/workflows/spec-lint.yml'
  - do: Tests workflow green on GitHub after the next push
    check: 'cmd: gh run list --workflow Tests --branch main --limit 1 --json conclusion -q ".[0].conclusion" | grep -qx success'
  next: push when the user says so, then check the run
