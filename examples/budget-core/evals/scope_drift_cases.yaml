version: '0.1'
purpose: Manual eval seeds to detect scope drift in Claude implementations
source_prompt: 'Example bundle: a budget ledger whose balance rules are proven in
  Dafny and exposed through a Python CLI.'
checks:
  must_include:
  - deposit adds exactly the amount
  - non-positive amounts rejected
  - overdraft rejected
  - balance never negative
  - ledger replay
  - malformed line reported with line number
  - negative opening balance refused
cases: []
