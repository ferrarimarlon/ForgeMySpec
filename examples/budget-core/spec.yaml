version: "0.1"
title: "Budget ledger core with a verified balance contract"
objective: >-
  Replay a ledger of deposits and withdrawals from an opening balance, rejecting
  overdrafts and non-positive amounts, with the arithmetic proven in Dafny and exposed
  to users through a small Python command-line shell.
execution_mode: critical

context:
  system: >-
    ForgeMySpec example bundle. The core is Dafny (contract.dfy refined by impl.dfy) and is
    translated to Python under generated/core-py; shell/budget_cli.py is the hand-written I/O layer.
  assumptions:
    - "Amounts and balances are unbounded integers; the ledger file is small enough to read into memory."
    - "A rejected transaction leaves the balance unchanged and is counted, and replay continues."
    - "The ledger format is one `deposit <int>` or `withdraw <int>` per line; blank lines and `#` comments are ignored."

constraints:
  - "Ledger arithmetic exists only in the Dafny core; the Python shell parses, validates preconditions and prints."
  - "The shell refuses a negative opening balance before calling the core, because translated code does not check `requires`."
  - "Python shell uses the standard library only."

success_criteria:
  - "`python3 -m forgemyspec gate examples/budget-core` exits 0 with every stage PASS."
  - "Replaying `deposit 10, withdraw 4, withdraw 7, deposit -1, deposit 2` from 0 prints `balance=8 rejected=2`."
  - "A malformed ledger line makes the CLI exit 2 and name the line number on stderr."

hypotheses:
  - id: h1
    description: "Deposits of a positive amount add exactly that amount, and non-positive deposits are rejected unchanged."
    confidence: 0.95
  - id: h2
    description: "Withdrawals within the balance subtract exactly the amount, and overdrafts or non-positive withdrawals are rejected unchanged, so the balance stays at or above zero."
    confidence: 0.95
  - id: h3
    description: "Replaying a ledger yields the balance defined by the contract's Replay function and the count defined by CountRejected."
    confidence: 0.85
  - id: h4
    description: "The CLI reports malformed ledger lines with their line number and exit code 2, and refuses a negative opening balance."
    confidence: 0.9

required_evidence:
  - "Gate report for this bundle with every stage PASS, including the mutation kill rate."
  - "Output of the Python boundary tests run against generated/core-py."

actions:
  - id: a1
    type: design
    description: "Write contract.dfy, tests.dfy and planted/ with obligation tags, get user approval, then the user locks."
    requires_confirmation: true
    supports: [h1, h2, h3]
  - id: a2
    type: implement
    description: "Write impl.dfy refining BudgetCore until dafny verify and dafny test pass."
    requires_confirmation: false
    supports: [h1, h2, h3]
  - id: a3
    type: implement
    description: "Write shell/budget_cli.py and tests_py/test_cli.py against the translated core."
    requires_confirmation: false
    supports: [h4]
  - id: a4
    type: validate
    description: "Run the gate and record its report."
    requires_confirmation: false
    supports: [h1, h2, h3, h4]

decision_rules:
  - "If a contract clause turns out to be unprovable as written, stop and amend the spec and contract with user approval instead of weakening impl.dfy."
  - "If a mutant or a planted error survives, strengthen tests.dfy or the contract through re-approval, or justify an equivalent mutant in impl.dfy."

formal:
  module: BudgetCore
  obligations:
    - id: deposit_exact
      kind: dafny
      statement: "ApplyDeposit with amount > 0 returns Applied(balance + amount)."
      hypotheses: [h1]
      must_include: ["deposit adds exactly the amount"]
    - id: non_positive_rejected
      kind: dafny
      statement: "ApplyDeposit and ApplyWithdraw with amount <= 0 return Rejected(balance, NonPositiveAmount)."
      hypotheses: [h1, h2]
      must_include: ["non-positive amounts rejected"]
    - id: withdraw_exact
      kind: dafny
      statement: "ApplyWithdraw with 0 < amount <= balance returns Applied(balance - amount)."
      hypotheses: [h2]
    - id: overdraft_rejected
      kind: dafny
      statement: "ApplyWithdraw with amount > balance returns Rejected(balance, Overdraft)."
      hypotheses: [h2]
      must_include: ["overdraft rejected"]
    - id: never_negative
      kind: dafny
      statement: "Every outcome balance and every replayed final balance is >= 0."
      hypotheses: [h2, h3]
      must_include: ["balance never negative"]
    - id: replay
      kind: dafny
      statement: "ApplyAll returns Replay(start, txs) and CountRejected(start, txs)."
      hypotheses: [h3]
      must_include: ["ledger replay"]
    - id: malformed_line
      kind: boundary
      statement: "A malformed ledger line exits 2 and names its line number."
      hypotheses: [h4]
      must_include: ["malformed line reported with line number"]
      test: "test_cli.CliTests.test_malformed_line_reports_line_number"
    - id: start_precondition
      kind: boundary
      statement: "The shell refuses a negative opening balance before calling the core."
      hypotheses: [h4]
      must_include: ["negative opening balance refused"]
      test: "test_cli.CliTests.test_negative_start_balance_is_refused_before_the_core"

metadata:
  source_prompt: "Example bundle: a budget ledger whose balance rules are proven in Dafny and exposed through a Python CLI."
  generator: claude-code-session
  scope_contract:
    must_include:
      - "deposit adds exactly the amount"
      - "non-positive amounts rejected"
      - "overdraft rejected"
      - "balance never negative"
      - "ledger replay"
      - "malformed line reported with line number"
      - "negative opening balance refused"
