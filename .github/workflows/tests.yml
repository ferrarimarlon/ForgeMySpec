name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Show toolchain
        run: |
          dafny --version
          python --version

      - name: Run harness tests (includes end-to-end gate runs)
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run the gate on the example bundle
        run: PYTHONPATH=src python -m forgemyspec gate examples/budget-core

      - name: Check that no external LLM API is referenced
        run: |
          if grep -rnE 'api\.openai\.com|api\.anthropic\.com|OPENAI_API_KEY|ANTHROPIC_API_KEY|load_dotenv' src plugins .github --exclude=tests.yml; then
            echo "External LLM API reference found" && exit 1
          fi
