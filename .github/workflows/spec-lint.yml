name: Spec Gate

on:
  push:
    paths:
      - '**/spec.yaml'
      - '**/*.dfy'
      - '**/contract.lock'
      - '**/shell/**'
      - '**/tests_py/**'
      - '**/.forgemyspec-policy.yaml'
  pull_request:
    paths:
      - '**/spec.yaml'
      - '**/*.dfy'
      - '**/contract.lock'
      - '**/shell/**'
      - '**/tests_py/**'
      - '**/.forgemyspec-policy.yaml'

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Find bundles touched by this change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range=""
          else
            range="$BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            files=$(git diff --name-only "$range")
          else
            files=$(git ls-files)
          fi
          # A bundle is the nearest directory (walking up) that holds a spec.yaml.
          bundles=""
          for f in $files; do
            d=$(dirname "$f")
            while [ "$d" != "." ] && [ ! -f "$d/spec.yaml" ]; do d=$(dirname "$d"); done
            if [ -f "$d/spec.yaml" ]; then bundles="$bundles $d"; fi
          done
          bundles=$(echo $bundles | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "bundles=$bundles" >> "$GITHUB_OUTPUT"
          echo "Bundles: ${bundles:-none}"

      - name: Gate formal bundles, lint the rest
        if: steps.changed.outputs.bundles != ''
        env:
          BUNDLES: ${{ steps.changed.outputs.bundles }}
        run: |
          status=0
          for b in $BUNDLES; do
            echo "::group::$b"
            if [ -f "$b/contract.dfy" ]; then
              PYTHONPATH=src python -m forgemyspec gate "$b" || status=1
            else
              PYTHONPATH=src python -m forgemyspec lint "$b/spec.yaml" || status=1
            fi
            echo "::endgroup::"
          done
          exit $status
